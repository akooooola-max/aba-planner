<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">

<title>ABA支援プランナー</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,'Hiragino Sans','Yu Gothic',sans-serif;background:#eef2f7;display:flex;flex-direction:column;height:100dvh;max-width:640px;margin:0 auto}

.hdr{background:#2b6cb0;color:white;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.hdr-left{display:flex;align-items:center;gap:10px}
.hdr-icon{font-size:1.3rem}
.hdr-title{font-size:0.95rem;font-weight:700}
.hdr-sub{font-size:0.7rem;opacity:0.8}
.hdr-btn{background:rgba(255,255,255,0.2);border:none;color:white;padding:6px 10px;border-radius:8px;font-size:0.75rem;cursor:pointer}

.setup{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 20px;gap:20px}
.setup-card{background:white;border-radius:16px;padding:28px 24px;width:100%;max-width:400px;box-shadow:0 4px 16px rgba(0,0,0,0.1)}
.setup-icon{font-size:2.5rem;text-align:center;margin-bottom:12px}
.setup-title{font-size:1.1rem;font-weight:800;color:#2d3748;text-align:center;margin-bottom:6px}
.setup-desc{font-size:0.85rem;color:#718096;text-align:center;line-height:1.7;margin-bottom:20px}
.setup-label{font-size:0.8rem;font-weight:700;color:#4a5568;margin-bottom:6px}
.setup-input{width:100%;border:2px solid #e2e8f0;border-radius:10px;padding:12px 14px;font-size:0.9rem;outline:none;font-family:inherit}
.setup-input:focus{border-color:#4299e1}
.setup-note{font-size:0.78rem;color:#a0aec0;margin-top:6px;line-height:1.6}
.setup-btn{width:100%;padding:14px;border:none;border-radius:10px;background:#2b6cb0;color:white;font-size:1rem;font-weight:700;cursor:pointer;margin-top:16px}
.setup-model{display:flex;gap:8px;margin-top:12px}
.model-btn{flex:1;padding:10px 6px;border:2px solid #e2e8f0;border-radius:8px;background:white;font-size:0.8rem;cursor:pointer;text-align:center;color:#4a5568}
.model-btn.active{border-color:#4299e1;background:#ebf8ff;color:#2b6cb0;font-weight:700}

.chat-wrap{flex:1;display:flex;flex-direction:column;overflow:hidden}
.chat{flex:1;overflow-y:auto;padding:16px 12px;display:flex;flex-direction:column;gap:12px}

.row{display:flex;align-items:flex-end;gap:8px}
.row.app{align-self:flex-start;max-width:92%}
.row.user{align-self:flex-end;flex-direction:row-reverse;max-width:88%}
.avatar{width:32px;height:32px;border-radius:50%;background:#2b6cb0;display:flex;align-items:center;justify-content:center;font-size:0.95rem;flex-shrink:0}
.bubble{padding:12px 14px;border-radius:18px;font-size:0.92rem;line-height:1.75}
.bubble.app{background:white;border-bottom-left-radius:4px;box-shadow:0 1px 4px rgba(0,0,0,0.08);color:#1a202c;width:100%}
.bubble.user{background:#2b6cb0;color:white;border-bottom-right-radius:4px}
.bubble h3{font-size:0.8rem;font-weight:700;color:#4299e1;letter-spacing:.06em;text-transform:uppercase;margin:14px 0 7px;padding-bottom:5px;border-bottom:2px solid #ebf8ff}
.bubble h3:first-child{margin-top:0}
.bubble table{width:100%;border-collapse:collapse;font-size:0.84rem;margin:6px 0}
.bubble th{background:#4299e1;color:white;padding:6px 8px;text-align:left;font-weight:600}
.bubble td{padding:7px 8px;border-bottom:1px solid #e2e8f0;line-height:1.6;vertical-align:top}
.bubble tr:last-child td{border-bottom:none}
.bubble tr:nth-child(even) td{background:#f7fafc}
.bubble .goal{background:#f0fff4;border:2px solid #68d391;border-radius:8px;padding:11px 13px;font-size:0.88rem;line-height:1.8;font-weight:600;color:#22543d;margin:6px 0}
.bubble .pbox{background:#faf5ff;border:1px solid #e9d8fd;border-radius:8px;padding:11px 13px;font-size:0.86rem;line-height:1.9;color:#44337a;margin:6px 0}
.bubble .warn{background:#fff5f5;border:1px solid #fed7d7;border-radius:8px;padding:10px 12px;font-size:0.85rem;color:#c53030;line-height:1.6;margin:4px 0}
.bubble ol,.bubble ul{padding-left:18px;margin:6px 0}
.bubble li{margin-bottom:5px;line-height:1.7}
.bubble strong{font-weight:700}
.bubble code{background:#ebf8ff;padding:1px 6px;border-radius:4px;font-size:0.88em;color:#2b6cb0;font-family:inherit}
.bubble hr{border:none;border-top:1px solid #e2e8f0;margin:10px 0}
.bubble p{margin-bottom:8px}
.bubble p:last-child{margin-bottom:0}

.qr-wrap{display:flex;flex-wrap:wrap;gap:8px;padding-left:40px;margin-top:-4px}
.qr-btn{background:white;border:2px solid #4299e1;color:#2b6cb0;border-radius:99px;padding:8px 14px;font-size:0.83rem;font-weight:600;cursor:pointer}
.qr-btn:active{background:#4299e1;color:white}
.qr-btn.used{background:#4299e1;color:white;pointer-events:none}

.typing{display:flex;gap:4px;padding:12px 14px;background:white;border-radius:18px;border-bottom-left-radius:4px;width:56px;box-shadow:0 1px 4px rgba(0,0,0,0.08)}
.dot{width:8px;height:8px;border-radius:50%;background:#a0aec0;animation:blink 1.2s infinite}
.dot:nth-child(2){animation-delay:.2s}
.dot:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:.3}40%{opacity:1}}

.input-area{background:white;border-top:1px solid #e2e8f0;padding:10px 12px;display:flex;gap:8px;flex-shrink:0}
.inp{flex:1;border:2px solid #e2e8f0;border-radius:22px;padding:10px 16px;font-size:0.92rem;outline:none;resize:none;max-height:100px;font-family:inherit;line-height:1.5}
.inp:focus{border-color:#4299e1}
.inp:disabled{background:#f7fafc;color:#a0aec0}
.send-btn{width:42px;height:42px;border-radius:50%;background:#2b6cb0;border:none;color:white;font-size:1.1rem;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.send-btn:disabled{background:#cbd5e0;cursor:not-allowed}

.err-banner{background:#fff5f5;border:1px solid #fed7d7;border-radius:8px;padding:10px 12px;font-size:0.85rem;color:#c53030;margin:4px 12px}
.action-row{display:flex;gap:8px;margin-top:14px}
.btn-print{flex:1;padding:11px;border:none;border-radius:8px;background:#38a169;color:white;font-size:0.88rem;font-weight:700;cursor:pointer}
.btn-new{flex:1;padding:11px;border:2px solid #4299e1;border-radius:8px;background:white;color:#4299e1;font-size:0.88rem;font-weight:700;cursor:pointer}
.note-s{font-size:0.75rem;color:#a0aec0;text-align:center;margin-top:8px;line-height:1.6}

@media print{
  .input-area,.hdr,.qr-wrap,.action-row,.note-s{display:none!important}
  body{background:white;height:auto}
  .chat{overflow:visible}
  .bubble.app{box-shadow:none;border:1px solid #e2e8f0}
}

    <button class="send-btn" id="send-btn" onclick="send()" disabled>↑</button>
  </div>
</div>

<script>
// ─────────────────────────────────────────────
// SYSTEM PROMPT（coachナレッジ全込み）
// ─────────────────────────────────────────────
const SYSTEM_PROMPT = `あなたはABA（応用行動分析学）の原理に基づく児童発達支援計画作成AIです。放課後等デイサービス・児童発達支援の現場で支援者が使います。出力した計画はすべて「原案」であり、最終判断は児発管が行います。

## 役割と姿勢
- こどもの尊厳・意思・安全・最善の利益を最優先にする
- 問題行動を責めず、環境との相互作用として理解する
- 行動の機能は断定せず「仮説」として示す
- 「落ち着きがない」「癇癪」などの抽象語を「いつ・どこで・何を・どのくらい」に変換する
- 不明点があれば最大5問まで質問する。質問は必ず番号付きの選択肢（1〜4）で提示する

## 禁止事項
- 診断・投薬・医療判断をしない
- 行動の原因を性格・家庭・保護者の責任と決めつけない
- 「わがまま」「問題児」など人格評価を使わない
- 身体拘束・隔離・脅しを通常支援として提案しない
- 消去単独での提案（必ず代替行動の強化とセット）
- 保護者を責める表現を使わない

## 会話の進め方
1. 支援者がお子さまの困り行動を説明する
2. 分かった情報（場面・行動・結果など）を整理して確認を伝える
3. 不足している情報を番号付き選択肢で質問する（最大5問）
4. 十分な情報が集まったら「支援計画を作成します」と伝え、以下の形式で出力する

## ABAナレッジ

### 行動定義
行動は「見える・聞こえる・数えられる」表現にする。
型：場面 / きっかけ / 行動 / 頻度 / 持続時間 / 強度 / 終了条件 / 除外条件 / 記録方法
NG例と変換：「落ち着きがない」→「集団活動開始後5分以内に席から立ち室内を歩く行動が3回以上」

### ABC分析
A（先行条件）→ B（行動）→ C（結果）の三項随伴性で整理する。
- A：直前のきっかけ＋背景事象（体調・睡眠・空腹・感覚過敏・予定変更）を分けて考える
- B：観察可能・測定可能に定義する
- C：支援者の意図ではなく「本人にとって何が起きたか」で見る

### 行動の4機能
1. 要求・獲得：物・活動・注目・継続を得るために起きている
2. 逃避・回避：課題・指示・感覚刺激・場面を避けるために起きている
3. 注目：大人や他児からの反応・接近を得るために起きている
4. 感覚・自動強化：行動自体から感覚刺激・安心感を得ている
機能は断定せず仮説として示す。複数機能の可能性を残す。

### 先行条件への支援
1. 望ましい行動の手がかりを提示（視覚スケジュール・手順表・見通しカード）
2. 問題行動を引き起こす刺激を環境から取り除く
3. 確立操作の設定（選択肢を与える・短い成功体験を積む）
4. 確立操作の除去（疲労・空腹・感覚過敏への配慮）
5. 問題行動の反応努力を増やす
6. 望ましい行動の反応努力を減らす

### FCT（機能的コミュニケーション訓練）
問題行動と同じ機能を満たす適切な代替コミュニケーションを教える。「やめさせる」より先に「どう伝えればよいか」を教える。
代替行動は「本人にとって簡単で・すぐ使えて・周囲が必ず反応できる」ものにする。
- 要求：「ください」「貸して」「もう一回」「これがいい」
- 逃避・休憩：「休憩」「手伝って」「むずかしい」「あとで」
- 注目：「見て」「来て」「一緒に」「聞いて」
- 拒否：「いや」「やめて」「おしまい」「いらない」
- 感覚調整：静かな場所・イヤーマフ・ぎゅっとして
手段：言葉・絵カード・写真・ジェスチャー・指差し・視線・AACから選ぶ

### プロンプト・フェイディング
プロンプト種類：身体（最小限）・モデル・ジェスチャー・言語・視覚・環境
フェイディング：時間遅延・手がかりを弱める・言語を減らす・距離を離す
「助けるため」に使い「依存させるため」に使わない。

### シェイピング
今できる近い行動から始め、3〜5段階で目標行動に近づける。各段階の達成基準と戻る基準を設定する。

### チェイニング・課題分析
複雑な行動を小さな工程に分けて教える。順行・逆行・全課題提示から選ぶ。

### 強化子アセスメント
強化子は「本人の行動が実際に増えるか」で判断する。
種類：物・活動・社会的強化（笑顔・称賛）・感覚・選択・休憩
即時強化・具体的称賛・選択肢・自然な強化への移行を計画する。
強化子を取り上げて脅しに使わない。

### 般化の促進
- 般化が生じたら強化する
- 多様な場面・人・状況で練習する
- 機能的に等価な行動を複数育てる
- 訓練場面に自然な手がかりを含める

### 5領域との接続
健康・生活 / 運動・感覚 / 認知・行動 / 言語・コミュニケーション / 人間関係・社会性
本人支援には5領域との関連を明記する（単なるラベル付けにしない）

### 倫理・安全
- 自傷・他害・逸走リスクがある場合は安全確保と専門職・管理者への相談を最優先にする
- 消去を使う場合は代替行動の強化とセット。消去バーストに注意。
- 弱化は最後の選択肢。適用には安全計画・保護者同意・管理者確認・専門職助言が必要。

### 保護者説明の言い換えルール
問題行動→困っている時に出やすい行動 / 指示が入らない→言葉だけでは伝わりにくい場面がある / 癇癪→気持ちや要求を伝える方法が見つからず泣く・座り込む / こだわりが強い→いつもの流れが変わると不安になりやすい / 他害→気持ちが高まった時に手が出てしまうことがある / 逃避→苦手さや不安を避けようとしている可能性がある

## 支援計画の出力形式
情報が十分集まったら、以下の構成で出力してください。

### ABC分析
| | 内容 |
|---|---|
| A（先行条件） | 〇〇 |
| B（行動） | 〇〇 |
| C（結果） | 〇〇 |
| 背景事象 | 〇〇 |

### 機能仮説
（4機能で検討。「〜の可能性があります」と仮説として示す）

### 短期目標（案）
> 〇〇の場面で、職員の促し1回以内で〇〇を、□週間で□割以上できるようになる。

### 先行条件への支援
1. 〇〇

### 代替行動（FCT）
1. 〇〇

### 結果への支援
1. 〇〇

### 職員向け手順
1. 〇〇

### 保護者説明文（案）
（強みから始め、専門用語を避け、責めない表現で）

### 児発管チェックリスト
☐ 行動が観察可能に定義されているか
☐ 機能を断定していないか
☐ 代替行動（FCT）が設定されているか
☐ 強化ベースになっているか
☐ 職員間で一貫して実施できるか
☐ 保護者説明として責める表現がないか

---
※ この計画は原案です。最終判断は児発管・担当者が行ってください。

## 必須ルール
- 必ず日本語で回答する
- 計画作成前に情報が不足していれば質問する（最大5問）
- 自傷・他害・逸走がある場合は計画作成より先に安全確認を促す
- お子さまや保護者を責める表現は絶対に使わない`;

// ─────────────────────────────────────────────
// STATE
// ─────────────────────────────────────────────
let apiKey = '';
let model = 'claude-haiku-4-5-20251001';
let messages = [];
let isLoading = false;

// ─────────────────────────────────────────────
// SETUP
// ─────────────────────────────────────────────
function selectModel(m) {
  model = m === 'haiku' ? 'claude-haiku-4-5-20251001' : 'claude-sonnet-4-6';
  document.getElementById('btn-haiku').classList.toggle('active', m === 'haiku');
  document.getElementById('btn-sonnet').classList.toggle('active', m === 'sonnet');
}

function saveAndStart() {
  const key = document.getElementById('api-key-input').value.trim();
  const err = document.getElementById('setup-err');
  if (!key) { err.textContent = 'APIキーを入力してください'; return; }
  if (!key.startsWith('sk-ant-')) { err.textContent = 'APIキーは sk-ant- で始まる文字列です'; return; }
  err.textContent = '';
  apiKey = key;
  localStorage.setItem('aba_api_key', key);
  localStorage.setItem('aba_model', model);
  startChat();
}

function showSetup() {
  document.getElementById('setup-screen').style.display = 'flex';
  document.getElementById('chat-wrap').style.display = 'none';
  document.getElementById('hdr').style.display = 'none';
  document.getElementById('api-key-input').value = apiKey;
}

function startChat() {
  document.getElementById('setup-screen').style.display = 'none';
  document.getElementById('chat-wrap').style.display = 'flex';
  document.getElementById('hdr').style.display = 'flex';
  document.getElementById('model-label').textContent = model.includes('haiku') ? '⚡ Haiku' : '✨ Sonnet';
  messages = [];
  document.getElementById('chat').innerHTML = '';
  enableInput();
  showTyping(600, () => {
    appMsg('こんにちは。ABA支援プランナーです。\n\nお子さまの様子をできるだけ具体的に教えてください。\n\n**例：**「白ごはんを食べません。給食の時だけで、提示されると泣いてしまいます」');
  });
}

// ─────────────────────────────────────────────
// CHAT UI
// ─────────────────────────────────────────────
function appMsg(text) {
  const chat = document.getElementById('chat');
  const row = document.createElement('div');
  row.className = 'row app';
  row.innerHTML = `<div class="avatar">🤖</div><div class="bubble app">${md(text)}</div>`;
  chat.appendChild(row);
  chat.scrollTop = 99999;
  return row;
}

function userMsg(text) {
  const chat = document.getElementById('chat');
  const row = document.createElement('div');
  row.className = 'row user';
  row.innerHTML = `<div class="bubble user">${esc(text)}</div>`;
  chat.appendChild(row);
  chat.scrollTop = 99999;
}

function showTyping(delay, cb) {
  const chat = document.getElementById('chat');
  const row = document.createElement('div');
  row.className = 'row app';
  row.innerHTML = `<div class="avatar">🤖</div><div class="typing"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>`;
  chat.appendChild(row);
  chat.scrollTop = 99999;
  setTimeout(() => { row.remove(); cb(); }, delay);
}

function addQR(labels) {
  const chat = document.getElementById('chat');
  const wrap = document.createElement('div');
  wrap.className = 'qr-wrap';
  labels.forEach((label, i) => {
    const btn = document.createElement('button');
    btn.className = 'qr-btn';
    btn.textContent = `${i + 1}. ${label}`;
    btn.onclick = () => {
      wrap.querySelectorAll('.qr-btn').forEach(b => { b.classList.add('used'); b.onclick = null; });
      handleInput(`${i + 1}`);
    };
    wrap.appendChild(btn);
  });
  chat.appendChild(wrap);
  chat.scrollTop = 99999;
}

function showError(msg) {
  const a = document.getElementById('err-area');
  a.innerHTML = `<div class="err-banner">⚠️ ${esc(msg)}</div>`;
  setTimeout(() => a.innerHTML = '', 8000);
}

function disableInput() {
  document.getElementById('inp').disabled = true;
  document.getElementById('send-btn').disabled = true;
}
function enableInput() {
  document.getElementById('inp').disabled = false;
  document.getElementById('send-btn').disabled = false;
}

// ─────────────────────────────────────────────
// MARKDOWN → HTML
// ─────────────────────────────────────────────
function md(t) {
  // escape first
  t = t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  // bold
  t = t.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');
  // code
  t = t.replace(/`([^`]+)`/g,'<code>$1</code>');
  // headings
  t = t.replace(/^### (.+)$/gm,'<h3>$1</h3>');
  t = t.replace(/^## (.+)$/gm,'<h3>$1</h3>');
  // hr
  t = t.replace(/^---+$/gm,'<hr>');
  // goal quote
  t = t.replace(/^&gt; (.+)$/gm,'<div class="goal">$1</div>');
  // warn
  t = t.replace(/^⚠️ (.+)$/gm,'<div class="warn">⚠️ $1</div>');
  // checklist
  t = t.replace(/^☐ (.+)$/gm,'<li class="chk"><label style="display:flex;gap:6px;align-items:flex-start"><input type="checkbox" style="margin-top:3px;flex-shrink:0"> <span>$1</span></label></li>');
  // numbered list
  t = t.replace(/^\d+\. (.+)$/gm,'<li>$1</li>');
  // bullet list
  t = t.replace(/^[・\-\*] (.+)$/gm,'<li>$1</li>');
  // wrap li groups
  t = t.replace(/(<li(?:\s[^>]*)?>[\s\S]*?<\/li>\n?)+/g, m => {
    if(m.includes('class="chk"')) return `<ul style="list-style:none;padding-left:0">${m}</ul>`;
    return `<ul>${m}</ul>`;
  });
  // tables
  t = t.replace(/^(\|.+\|)$/gm, line => {
    if(/^\|[-| ]+\|$/.test(line)) return '';
    const cells = line.split('|').slice(1,-1);
    return `<tr>${cells.map(c=>`<td>${c.trim()}</td>`).join('')}</tr>`;
  });
  t = t.replace(/(<tr>[\s\S]*?<\/tr>)/g, m => {
    const rows = m.match(/<tr>[\s\S]*?<\/tr>/g) || [];
    return `<table>${rows.map((r,i)=>i===0?r.replace(/td/g,'th'):r).join('')}</table>`;
  });
  // paragraphs
  t = t.replace(/\n\n/g,'</p><p>');
  t = '<p>' + t + '</p>';
  t = t.replace(/<p>(<h3>|<hr>|<ul>|<table>|<div)/g,'$1');
  t = t.replace(/(<\/h3>|<\/ul>|<\/table>|<\/div>)<\/p>/g,'$1');
  t = t.replace(/<p><\/p>/g,'');
  t = t.replace(/\n/g,'<br>');
  return t;
}

function esc(t){ return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

// ─────────────────────────────────────────────
// API
// ─────────────────────────────────────────────
async function callAPI(userText) {
  messages.push({ role: 'user', content: userText });
  const res = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'x-api-key': apiKey,
      'anthropic-version': '2023-06-01',
      'anthropic-dangerous-direct-browser-access': 'true'
    },
    body: JSON.stringify({
      model,
      max_tokens: 4096,
      system: SYSTEM_PROMPT,
      messages
    })
  });

  if (!res.ok) {
    const e = await res.json().catch(()=>({}));
    if (res.status === 401) throw new Error('APIキーが無効です。⚙️設定から確認してください。');
    if (res.status === 429) throw new Error('リクエスト制限に達しました。しばらく待ってください。');
    throw new Error(e.error?.message || `エラー ${res.status}`);
  }

  const data = await res.json();
  const reply = data.content[0].text;
  messages.push({ role: 'assistant', content: reply });
  return reply;
}

// ─────────────────────────────────────────────
// QR EXTRACTION
// ─────────────────────────────────────────────
function extractQR(text) {
  const qr = [];
  const lines = text.split('\n');
  for (const line of lines) {
    const m = line.match(/^[①②③④1-4１-４][.．。)） ]\s*\*{0,2}(.+?)\*{0,2}$/);
    if (m) qr.push(m[1].trim());
    if (qr.length >= 4) break;
  }
  return qr.length >= 2 ? qr : [];
}

// ─────────────────────────────────────────────
// SEND
// ─────────────────────────────────────────────
async function handleInput(text) {
  const t = text.trim();
  if (!t || isLoading) return;
  document.querySelectorAll('.qr-btn').forEach(b => { b.classList.add('used'); b.onclick = null; });
  userMsg(t);
  disableInput();
  isLoading = true;

  const typingRow = (() => {
    const chat = document.getElementById('chat');
    const row = document.createElement('div');
    row.className = 'row app';
    row.innerHTML = `<div class="avatar">🤖</div><div class="typing"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>`;
    chat.appendChild(row);
    chat.scrollTop = 99999;
    return row;
  })();

  try {
    const reply = await callAPI(t);
    typingRow.remove();

    const hasPlan = /ABC分析|機能仮説|短期目標|職員向け手順/.test(reply);
    const row = appMsg(reply);

    if (hasPlan) {
      const bubble = row.querySelector('.bubble');
      const acts = document.createElement('div');
      acts.className = 'action-row';
      acts.innerHTML = `<button class="btn-print" onclick="window.print()">🖨️ 印刷・PDF</button><button class="btn-new" onclick="newChat()">新しい相談</button>`;
      const note = document.createElement('p');
      note.className = 'note-s';
      note.textContent = '※ この計画は原案です。最終判断は児発管・担当者が行ってください。';
      bubble.appendChild(acts);
      bubble.appendChild(note);
    } else {
      const qr = extractQR(reply);
      if (qr.length) addQR(qr);
    }

    document.getElementById('chat').scrollTop = 99999;
    enableInput();
  } catch (e) {
    typingRow.remove();
    showError(e.message);
    messages.pop();
    enableInput();
  }
  isLoading = false;
}

function newChat() {
  messages = [];
  document.getElementById('chat').innerHTML = '';
  showTyping(500, () => {
    appMsg('新しい相談を始めます。\n\nお子さまの様子をできるだけ具体的に教えてください。');
  });
}

// ─────────────────────────────────────────────
// INPUT
// ─────────────────────────────────────────────
function send() {
  const inp = document.getElementById('inp');
  handleInput(inp.value);
  inp.value = '';
  inp.style.height = '';
}
function handleKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
}
function resize(el) {
  el.style.height = '';
  el.style.height = Math.min(el.scrollHeight, 100) + 'px';
}

// ─────────────────────────────────────────────
// INIT
// ─────────────────────────────────────────────
window.onload = () => {
  const key = localStorage.getItem('aba_api_key');
  const m = localStorage.getItem('aba_model');
  if (m) { model = m; selectModel(m.includes('haiku') ? 'haiku' : 'sonnet'); }
  if (key && key.startsWith('sk-ant-')) {
    apiKey = key;
    document.getElementById('api-key-input').value = key;
    startChat();
  }
};
